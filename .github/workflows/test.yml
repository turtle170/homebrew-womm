name: Test formula

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: brew install womm (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, macos-15-intel]
    steps:
      - name: Tap this checkout
        run: |
          brew tap turtle170/womm "https://github.com/${GITHUB_REPOSITORY}"
          cd "$(brew --repo turtle170/womm)"
          git fetch -q origin "$GITHUB_SHA" && git checkout -q "$GITHUB_SHA"
          # Homebrew 7 refuses third-party taps until you trust them (older brews have no such command).
          if brew commands | grep -qx trust; then brew trust turtle170/womm; fi
      - name: Audit
        run: brew audit --strict turtle170/womm/womm
      - name: Build from source
        run: brew install --build-from-source --verbose turtle170/womm/womm
      - name: Test
        run: brew test --verbose turtle170/womm/womm
      - name: It works on this machine
        run: |
          womm --version
          womm why
          ! (echo n | womm ship nonet)
          echo y | womm ship nonet
          test -e "$(brew --prefix womm)/libexec/bin/womm-packages/nonet/manifest.toml"
          womm ask will this work on my machine
